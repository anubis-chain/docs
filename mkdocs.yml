# Project information
site_name: Documentation
site_url: https://docs.anubispace.org
site_author: Anubis Chain
site_description: >-
  Get started with Anubis Chain Docs. Explore the documentation for Anubis Chain
# Repository
repo_name: Anubis Chain GitHub
repo_url: https://github.com/anubis-chain/anubis-chain.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/anubis.svg
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
    share: octicons/share-android-24
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: octicons/sun-24
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: octicons/moon-24
        name: Switch to dark mode
  features:
#    - announce.dismiss
    - search.suggest
    - search.highlight
    - search.share
    - navigation.instant
#    - navigation.instant.progress
    - navigation.tracking
    - navigation.integration
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
#    - navigation.expand
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tooltips
#    - content.action.view


# Page tree
nav:
  - Home: index.md
  - Announcements:
    - Announcements: ./announce/index.md
    - Upcoming:
      - NA: ./announce/na.md
    - Passed:
      - NA: ./announce/na.md

  - Anubis Chain:
    - Anubis Chain: ./anubis-chain/index.md
    - Overview: ./anubis-chain/overview.md
    - Introduction: ./anubis-chain/introduction.md
    - Developers:
        - Quick Guide: ./anubis-chain/developers/quick-guide.md
        - Dev-Tools: https://anubischain.ai/en/dev-tools
        - JSON-RPC:
            - Json Rpc Endpoint: ./anubis-chain/developers/json_rpc/json-rpc-endpoint.md
            - Anubis Api list: ./anubis-chain/developers/json_rpc/anubis-api-list.md
        - Node Operators:
            - Node Best Practices: ./anubis-chain/developers/node_operators/node_best_practices.md
            - Node Types:
              - Full Node: ./anubis-chain/developers/node_operators/full_node.md
              - Archive Node: ./anubis-chain/developers/node_operators/archive_node.md
              - Fast Node: ./anubis-chain/developers/node_operators/fast_node.md
            - Insfrastructure & Setup:
              - Boot Node: ./anubis-chain/developers/node_operators/boot_node.md
              - Docker Image: ./anubis-chain/developers/node_operators/docker.md
            - Maintenance & Upgrades:
              - Upgrade Geth: ./anubis-chain/developers/node_operators/upgrade_geth.md
              - Node Maintenance: ./anubis-chain/developers/node_operators/node_maintenance.md
        - EOA Paymaster:
            - Overview: ./anubis-chain/developers/paymaster/overview.md
            - Paymaster API Spec: ./anubis-chain/developers/paymaster/paymaster-api.md
            - Wallet Integration: ./anubis-chain/developers/paymaster/wallet-integration.md
            - Try Gasless Transaction: ./anubis-chain/developers/paymaster/wallet-demo.md
    - Staking:
        - Overview: ./anubis-chain/staking/overview.md
        - User Guide: ./anubis-chain/staking/user-guide.md
        - Build Staking dApps: ./anubis-chain/staking/developer-guide.md
    - Governance:
        - Overview: ./anubis-chain/governance/overview.md
        - User Guide: ./anubis-chain/governance/user-guide.md
        - Anubis Advocate`s Guide : ./anubis-chain/governance/anubis-kol.md
        - Temperature Check: ./anubis-chain/governance/temp-check.md
        - Governance APIs: ./anubis-chain/governance/apis.md
    - Validator:
        - Overview: ./anubis-chain/validator/overview.md
        - Run Validator: ./anubis-chain/validator/run-val.md
        - Create Validator: ./anubis-chain/validator/create-val.md
        - Secure Validator: ./anubis-chain/validator/security.md
        - Key Management: ./anubis-chain/validator/manage-keys.md
        - EVN:
            - Overview: ./anubis-chain/validator/evn/overview.md
            - Best Practice: ./anubis-chain/validator/evn/best-practice.md
            - Network Monitor: ./anubis-chain/validator/evn/network-monitor.md
            - FAQs: ./anubis-chain/validator/evn/faqs.md
    - Slashing:
        - Overview: ./anubis-chain/slashing/overview.md
        - Slash Rules: ./anubis-chain/slashing/slash-rules.md
        - Slash Monitor: ./anubis-chain/slashing/monitor.md
    - Cross Chain Bridge: ./anubis-chain/cross-chain-bridge.md
    - Benchmark: ./anubis-chain/benchmark/design-reference.md
    - FAQ:  ./anubis-chain/faq/index.md

markdown_extensions:
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 4
  - codehilite
  - admonition
  - footnotes
  - def_list
  - attr_list
  - abbr
  - meta
  - smarty
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.extra

plugins:
  - search
  - mkdocs-video
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true


extra_css:
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap
  - assets/style/index.css
  - assets/style/components/banner.css
  - assets/style/components/nav.css
  - assets/style/components/sidebar.css
  - assets/style/components/content.css
  - https://unpkg.com/katex@0.16.10/dist/katex.min.css

extra_javascript:
  - assets/js/mathjax.js
  - assets/js/custom.js

extra:
  generator: false
  homepage: https://anubischain.ai
  analytics:
    provider: custom
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
